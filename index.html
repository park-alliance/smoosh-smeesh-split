<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
    <title>Smoosh & Smeesh Split</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-shell">
        <header>
            <h1>Smoosh &amp; Smeesh Split</h1>
        </header>

        <main>
            <div class="toolbar">
                <button id="scan-receipt-btn" class="primary-btn">Scan Receipt</button>
                <input type="file" id="receipt-photo-input" accept="image/*" capture="environment" class="hidden">
                <label class="tax-label">Tax
                    <input type="number" id="tax-input" step="0.01" value="0">
                </label>
            </div>
            <button id="load-sample-btn" class="ghost-btn">Load Sample Receipt (dev)</button>

            <div id="scan-status" class="scan-status hidden"></div>

            <div id="unknown-list" class="unknown-list hidden"></div>

            <div id="swipe-stack" class="swipe-stack hidden"></div>
            <div id="stack-remaining" class="stack-remaining hidden"></div>
            <div id="empty-state" class="empty-state hidden">Scan a receipt or add an item below to get started.</div>

            <h2 id="decided-heading" class="section-heading hidden">Decided</h2>
            <div id="items-list" class="items-list"></div>

            <button id="add-item-btn" class="ghost-btn">+ Add item</button>
        </main>

        <footer id="totals" class="totals">
            Add items to see the split.
        </footer>
    </div>

    <script src="vendor/tesseract/tesseract.min.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
